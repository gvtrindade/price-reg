<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#2B2521"/>
      <stop offset="100%" stop-color="#141110"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF8EF"/>
      <stop offset="100%" stop-color="#E9E2D2"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#78A890" stop-opacity="0"/>
      <stop offset="18%" stop-color="#78A890" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6FAE92" stop-opacity="1"/>
      <stop offset="82%" stop-color="#78A890" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#78A890" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="7" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- book -->
  <g transform="rotate(-7 256 270)" filter="url(#shadow)">
    <rect x="144" y="146" width="224" height="272" rx="20" fill="url(#cover)"/>
    <!-- spine -->
    <path d="M164 146h-1a19 19 0 0 0-19 19v234a19 19 0 0 0 19 19h1z" fill="#D8CEBA"/>
    <path d="M174 152v260" stroke="#C3B8A2" stroke-width="3"/>
    <!-- barcode -->
    <g fill="#1A1614">
      <rect x="200" y="214" width="9" height="98" rx="1.5"/>
      <rect x="216" y="214" width="4" height="98" rx="1"/>
      <rect x="226" y="214" width="13" height="98" rx="1.5"/>
      <rect x="246" y="214" width="5" height="98" rx="1"/>
      <rect x="257" y="214" width="9" height="98" rx="1.5"/>
      <rect x="273" y="214" width="4" height="98" rx="1"/>
      <rect x="283" y="214" width="12" height="98" rx="1.5"/>
      <rect x="302" y="214" width="5" height="98" rx="1"/>
      <rect x="313" y="214" width="9" height="98" rx="1.5"/>
    </g>
    <!-- price underline / label -->
    <rect x="200" y="330" width="122" height="7" rx="3.5" fill="#A09687"/>
  </g>

  <!-- price tag -->
  <g transform="translate(-10 10) rotate(16 382 132)">
    <path d="M336 128c0-13 11-24 24-24h35l35 35-35 35h-35c-13 0-24-11-24-24z" fill="#D98C45"/>
    <circle cx="356" cy="139" r="9" fill="#1A1614"/>
    <circle cx="356" cy="139" r="4" fill="#F5F2E8"/>
  </g>

  <!-- scan beam -->
  <g filter="url(#glow)">
    <rect x="72" y="292" width="368" height="7" rx="3.5" fill="url(#beam)"/>
  </g>
  <rect x="150" y="294" width="212" height="2" rx="1" fill="#E7FFF3" opacity="0.55"/>
</svg>
